<header class="portfolio-header" role="banner">
  <div class="portfolio-header__inner">
    <a class="site-identity" rel="author" href="{{ "/" | relative_url }}">
      <span class="site-identity__name">Ivan Fedyunin</span>
      <span class="site-identity__alias">
        <img src="{{ "/assets/brand/logo.png" | relative_url }}" alt="" aria-hidden="true" width="512" height="367">
        unmanbearpig
      </span>
    </a>

    <nav class="portfolio-nav" aria-label="Primary navigation">
      <a href="{{ "/work/" | relative_url }}"{% if page.url == '/work/' %} aria-current="page"{% endif %}>Work</a>
      <a href="{{ "/blog/" | relative_url }}"{% if page.url == '/blog/' or page.layout == 'post' %} aria-current="page"{% endif %}>Writing</a>
      <a href="{{ "/about/" | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a class="portfolio-nav__cv" href="{{ "/assets/cv/Ivan_Fedyunin_CV.pdf" | relative_url }}">CV <span aria-hidden="true">PDF</span></a>
    </nav>

    <details class="portfolio-menu">
      <summary>Menu</summary>
      <nav aria-label="Mobile navigation">
        <a href="{{ "/work/" | relative_url }}">Work</a>
        <a href="{{ "/blog/" | relative_url }}">Writing</a>
        <a href="{{ "/about/" | relative_url }}">About</a>
        <a href="{{ "/assets/cv/Ivan_Fedyunin_CV.pdf" | relative_url }}">CV PDF</a>
      </nav>
    </details>
  </div>
</header>
