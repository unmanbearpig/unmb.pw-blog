<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <head>
    <link rel="stylesheet" href="/assets/css/video-player-theme.css">
    <script src="/assets/js/video-player.js" defer></script>
    {% if page.layout == 'travel' or page.layout == 'travel-post' or layout.name == 'travel' %}
    <link rel="stylesheet" href="/assets/css/travel.css">
    {% endif %}
  </head>

  <body {% if page.layout == 'travel' or page.layout == 'travel-post' or layout.name == 'travel' %}class="travel-page"{% endif %}>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

  </body>

</html>
