title: Ivan Fedyunin
short_title: unmanbearpig
email: ivan.fedyunin@gmail.com
description: >-
  Senior backend and product engineer building data-heavy and operational
  systems with Ruby on Rails, PostgreSQL, Go, Python and evaluated AI.
url: "https://unmb.pw"
baseurl: ""
lang: en
timezone: America/Santiago
review_mode: true
service_review_url: "http://127.0.0.1:4322/"

author:
  name: Ivan Fedyunin
  location: Santiago, Chile
  github: unmanbearpig
  linkedin: ifedyunin

show_excerpts: true
default_content_lang: en
permalink: /blog/:categories/:year/:month/:day/:title.html

theme: minima
plugins:
  - jekyll-feed

feed:
  path: /blog/feed.xml

collections:
  ticks_and_trips:
    output: true
    permalink: /blog/:collection/:name/
  links:
  travel:
    output: true
    permalink: /blog/:collection/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Ivan Fedyunin
      theme: editorial
  - scope:
      path: ""
      type: travel
    values:
      theme: editorial
  - scope:
      path: ""
      type: ticks_and_trips
    values:
      theme: editorial

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - .bundle/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - venv/
  - deploy.sh
  - Makefile
  - README.md
  - TODO
  - b2_photo_gallery.py
  - b2_photo_gallery.sh
  - layout_strategies/
  - requirements.txt
  - update-responsive-images.py
  - worktrees/
  - review-assets/
  - plans/
